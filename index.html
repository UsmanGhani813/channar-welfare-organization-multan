<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>چنڑ ویلفیئر آرگنائزیشن - ووٹنگ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 12px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 18px;
      text-align: center;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      color: #666;
      line-height: 1.8;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin: 0 0 22px;
    }

    .candidate {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px;
      margin-bottom: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      cursor: pointer;
      transition: .2s;
    }

    .candidate.selected {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .candidate:hover {
      border-color: #2563eb;
    }

    .candidate-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .candidate input {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .candidate-name {
      font-size: 17px;
      font-weight: bold;
    }

    .votes {
      text-align: center;
      min-width: 55px;
    }

    .vote-number {
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .vote-label {
      font-size: 11px;
      color: #777;
      margin-top: 4px;
    }

    .form-title {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
    }

    .form-group {
      margin-top: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .submit-btn {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #15803d;
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.7;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .note {
      text-align: center;
      margin-top: 16px;
      color: #777;
      font-size: 13px;
      line-height: 1.7;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 13px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>چنڑ ویلفیئر آرگنائزیشن</h1>
    <p>اپنے خاندان کی خدمت، اتحاد اور بہتری کے لیے</p>
  </div>

  <div class="card">

    <h2>امیدوار منتخب کریں</h2>

    <form id="voteForm">

      <label class="candidate">
        <div class="candidate-info">
          <input type="radio" name="candidate"
            value="A" required>
          <span class="candidate-name">
            A
          </span>
        </div>

        <div class="votes">
          <div class="vote-number" id="count1">0</div>
          <div class="vote-label">ووٹ</div>
        </div>
      </label>


      <label class="candidate">
        <div class="candidate-info">
          <input type="radio" name="candidate"
            value="B">
          <span class="candidate-name">
            B
          </span>
        </div>

        <div class="votes">
          <div class="vote-number" id="count2">0</div>
          <div class="vote-label">ووٹ</div>
        </div>
      </label>


      <label class="candidate">
        <div class="candidate-info">
          <input type="radio" name="candidate"
            value="C">
          <span class="candidate-name">
            C
          </span>
        </div>

        <div class="votes">
          <div class="vote-number" id="count3">0</div>
          <div class="vote-label">ووٹ</div>
        </div>
      </label>


      <label class="candidate">
        <div class="candidate-info">
          <input type="radio" name="candidate"
            value="D">
          <span class="candidate-name">
            D
          </span>
        </div>

        <div class="votes">
          <div class="vote-number" id="count4">0</div>
          <div class="vote-label">ووٹ</div>
        </div>
      </label>


      <div class="form-title">
        ووٹر کی معلومات
      </div>


      <div class="form-group">
        <label>مکمل نام</label>
        <input type="text" id="name" required
          placeholder="اپنا مکمل نام لکھیں">
      </div>


      <div class="form-group">
        <label>والد کا نام</label>
        <input type="text" id="fatherName" required
          placeholder="والد کا مکمل نام لکھیں">
      </div>


      <div class="form-group">
        <label>فون نمبر</label>
        <input type="tel" id="phone" required
          placeholder="03001234567">
      </div>


      <div class="form-group">
        <label>CNIC نمبر</label>
        <input type="text" id="cnic" required
          placeholder="12345-1234567-1">
      </div>


      <button type="submit"
        class="submit-btn"
        id="submitButton">
        ووٹ جمع کریں
      </button>

      <div id="message" class="message"></div>

      <div class="note">
        ایک CNIC نمبر سے صرف ایک ووٹ قبول کیا جائے گا۔
      </div>

    </form>

  </div>

  <div class="footer">
    © چنڑ ویلفیئر آرگنائزیشن<br>
    Channar Welfare Organization
  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxJl9eGw7MDZhsebmteZ0SUJYYnxRB3K7RPJuWibpDg93IPs3Jend36lhDSyn1dR3LFBA/exec";


const candidates = [
  "مفتی غلام مرتضیٰ صاحب",
  "عظیم مجید صاحب",
  "محمد عثمان ظافر صاحب",
  "قاضی سیف اللہ صاحب"
];


const countIds = {
  "مفتی غلام مرتضیٰ صاحب": "count1",
  "عظیم مجید صاحب": "count2",
  "محمد عثمان ظافر صاحب": "count3",
  "قاضی سیف اللہ صاحب": "count4"
};


/* LOAD LIVE VOTE COUNTS */

function loadVoteCounts() {

  const oldScript =
    document.getElementById("jsonp-script");

  if (oldScript) {
    oldScript.remove();
  }


  window.receiveVoteCounts = function(data) {

    if (data && data.success && data.counts) {

      candidates.forEach(function(candidate) {

        const element =
          document.getElementById(
            countIds[candidate]
          );

        if (element) {
          element.textContent =
            data.counts[candidate] || 0;
        }

      });

    }

  };


  const script =
    document.createElement("script");

  script.id = "jsonp-script";

  script.src =
    API_URL +
    "?action=counts" +
    "&callback=receiveVoteCounts" +
    "&t=" + Date.now();

  document.body.appendChild(script);

}


/* SHOW MESSAGE */

function showMessage(message, type) {

  const box =
    document.getElementById("message");

  box.textContent = message;
  box.className = "message " + type;

}


/* CANDIDATE SELECTION */

document
  .querySelectorAll('input[name="candidate"]')
  .forEach(function(radio) {

    radio.addEventListener("change", function() {

      document
        .querySelectorAll(".candidate")
        .forEach(function(card) {
          card.classList.remove("selected");
        });

      radio
        .closest(".candidate")
        .classList.add("selected");

    });

  });


/* SUBMIT VOTE */

document
  .getElementById("voteForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();


    const selectedCandidate =
      document.querySelector(
        'input[name="candidate"]:checked'
      );


    if (!selectedCandidate) {

      showMessage(
        "براہ کرم ایک امیدوار منتخب کریں۔",
        "error"
      );

      return;

    }


    const button =
      document.getElementById("submitButton");

    button.disabled = true;

    button.textContent =
      "ووٹ جمع ہو رہا ہے...";


    const voteData = {

      candidate:
        selectedCandidate.value,

      name:
        document
          .getElementById("name")
          .value
          .trim(),

      fatherName:
        document
          .getElementById("fatherName")
          .value
          .trim(),

      phone:
        document
          .getElementById("phone")
          .value
          .trim(),

      cnic:
        document
          .getElementById("cnic")
          .value
          .trim()

    };


    try {

      await fetch(API_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(voteData)

      });


      showMessage(
        "آپ کا ووٹ کامیابی سے بھیج دیا گیا ہے۔ شکریہ!",
        "success"
      );


      document
        .getElementById("voteForm")
        .reset();


      document
        .querySelectorAll(".candidate")
        .forEach(function(card) {
          card.classList.remove("selected");
        });


      setTimeout(function() {
        loadVoteCounts();
      }, 2000);


    }

    catch (error) {

      console.error(error);

      showMessage(
        "ووٹ جمع کرنے میں مسئلہ پیش آیا۔ براہ کرم دوبارہ کوشش کریں۔",
        "error"
      );

    }


    button.disabled = false;

    button.textContent =
      "ووٹ جمع کریں";

  });


/* START */

loadVoteCounts();


/* AUTO REFRESH */

setInterval(
  loadVoteCounts,
  30000
);

</script>

</body>
</html>
